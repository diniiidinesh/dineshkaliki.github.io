<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinesh Kumar Kaliki</title>
<meta name="description" content="Portfolio of Dinesh Kumar Kaliki — work in progress.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0b0f;
    --bg-2: #14141c;
    --fg: #f4f4f6;
    --muted: #9a9aa5;
    --accent: #7c8cff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fafafa;
      --bg-2: #ffffff;
      --fg: #16161a;
      --muted: #6b6b76;
      --accent: #4550e6;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    background: radial-gradient(circle at 50% 20%, var(--bg-2), var(--bg) 70%);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    text-align: center;
    padding: 24px;
  }
  .name {
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    animation: fadeUp 0.8s ease-out 0.1s forwards;
  }
  h1 {
    font-size: clamp(2.4rem, 8vw, 5.5rem);
    font-weight: 700;
    margin: 0.3em 0 0.2em;
    line-height: 1.05;
    background: linear-gradient(120deg, var(--fg), var(--accent), var(--fg));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite, fadeUp 0.8s ease-out 0.3s backwards;
  }
  p.tagline {
    color: var(--muted);
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    max-width: 32em;
    margin: 0 auto;
    opacity: 0;
    animation: fadeUp 0.8s ease-out 0.55s forwards;
  }
  .dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin: 0 3px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .dots span:nth-child(1) { animation-delay: -0.32s; }
  .dots span:nth-child(2) { animation-delay: -0.16s; }
  .links {
    margin-top: 2.5em;
    display: flex;
    gap: 1.5em;
    opacity: 0;
    animation: fadeUp 0.8s ease-out 0.8s forwards;
  }
  .links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.95rem;
    border-bottom: 1px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .links a:hover {
    color: var(--fg);
    border-color: var(--accent);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="name">Dinesh Kumar Kaliki</div>
  <h1>Work in Progress</h1>
  <p class="tagline">
    Building a home for my product work, apps, and the odd side project.
    Check back soon.
  </p>
  <div class="dots" style="margin-top: 1.2em;">
    <span></span><span></span><span></span>
  </div>
  <div class="links">
    <a href="https://www.linkedin.com/in/dinesh-kumar-kaliki" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://github.com/diniiidinesh" target="_blank" rel="noopener">GitHub</a>
  </div>
</body>
</html>
